name: Docker Build and Push

on:
  push:
    branches: [ main ]
  repository_dispatch:
    types: [ frontend-released ]

concurrency:
  group: docker-publish

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create a tag
        id: commit_hash
        run: echo "SHORT_SHA=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: Login to Github Repository
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64,linux/arm64
          build-args: |
            ${{ github.event.client_payload.frontend_image && format('FRONTEND_IMAGE={0}', github.event.client_payload.frontend_image) || '' }}
          push: true
          tags: |
            ghcr.io/vaynerakawalo/${{ github.event.repository.name }}:${{ steps.commit_hash.outputs.SHORT_SHA }}
            ghcr.io/vaynerakawalo/${{ github.event.repository.name }}:latest